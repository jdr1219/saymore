<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>Glass Chat</title>
<link rel="icon" id="icon-ico" type="image/x-icon" href="favicon.ico"/>
<link rel="icon" id="icon-32" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="apple-touch-icon" id="apple-touch" sizes="180x180" href="apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="games.css"/>
</head>
<body>

<canvas id="pcanvas"></canvas>
<div id="bg"></div>

<!-- WELCOME / FIRST-TIME PROFILE SETUP -->
<div id="login-screen" class="screen hidden">
  <div class="glass login-card" id="login-card">
    <div class="logo-wrap" id="setup-avatar-wrap">
      <img class="logo-img" id="setup-avatar-preview" src="apple-touch-icon.png" alt="Your photo"/>
      <button class="avatar-edit-overlay" id="setup-avatar-btn" title="Change photo" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
      </button>
      <input type="file" id="setup-avatar-upload" accept="image/*" style="display:none"/>
    </div>
    <h1 class="login-title" id="login-title">Welcome to Glass Chat</h1>
    <p class="login-sub" id="login-sub">Set up your profile to get started</p>
    <input class="name-input" id="name-input" type="text" placeholder="Your name..." maxlength="20" autocomplete="off" spellcheck="false"/>

    <div class="code-row" id="signup-code-row">
      <label class="code-row-label">Your 4-digit code <span class="code-row-hint">so no one can impersonate you</span></label>
      <div class="code-input-wrap">
        <input class="code-input" id="signup-code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000"/>
        <button class="code-regen-btn" id="signup-code-regen" type="button" title="Get a new code">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </div>

    <input class="code-input code-input-standalone hidden" id="signin-code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Your 4-digit code"/>

    <div class="field-error" id="field-error"></div>
    <button class="join-btn" id="join-btn">Join Chat</button>
    <button class="signin-toggle-btn" id="signin-toggle-btn" type="button">Already have an account? Sign in</button>
    <div class="theme-picker-inline" id="login-theme-picker">
      <div class="theme-picker-label">Theme</div>
      <div class="theme-mini-grid" id="theme-grid-login"></div>
    </div>
  </div>
</div>

<!-- CHAT -->
<div id="chat-screen" class="screen hidden">
  <div class="app-layout" id="app-layout">
    <div class="rail-backdrop" id="rail-backdrop"></div>
    <nav class="glass side-rail" id="side-rail">
      <div class="rail-section" data-section="notis">
        <button class="rail-row" id="rail-notis-btn" type="button" title="Notifications">
          <span class="rail-icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="rail-badge" id="rail-noti-badge" hidden></span>
          </span>
          <span class="rail-label">Notifications</span>
        </button>
        <div class="rail-flyout" id="noti-flyout">
          <div class="noti-list" id="noti-list"></div>
        </div>
      </div>

      <div class="rail-section" data-section="rooms">
        <button class="rail-row" id="rail-rooms-btn" type="button" title="Rooms">
          <span class="rail-icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1.5"/><circle cx="14" cy="12" r="1"/></svg></span>
          <span class="rail-label">Rooms</span>
        </button>
        <div class="rail-flyout" id="rooms-flyout">
          <div class="room-list" id="room-list"></div>
          <button class="rail-create-btn" id="create-room-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Room
          </button>
          <div class="rail-create-form hidden" id="create-room-form">
            <input id="create-room-input" placeholder="room-name" maxlength="30" autocomplete="off"/>
            <button id="create-room-submit" type="button">Create</button>
          </div>
        </div>
      </div>

      <div class="rail-section" data-section="roomsearch">
        <button class="rail-row" id="rail-search-btn" type="button" title="Search rooms or people">
          <span class="rail-icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <span class="rail-label">Search</span>
        </button>
        <div class="rail-flyout" id="room-search-flyout">
          <input class="rail-search-input" id="room-search-input" placeholder="Search rooms or people..." autocomplete="off"/>
          <div class="room-search-results" id="room-search-results"></div>
        </div>
      </div>

      <div class="rail-section rail-link" data-section="games">
        <button class="rail-row" id="rail-games-btn" type="button" title="Glass Games">
          <span class="rail-icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="13" r="1"/><circle cx="18" cy="11" r="1"/><rect x="2" y="6" width="20" height="12" rx="6"/></svg></span>
          <span class="rail-label">Glass Games</span>
        </button>
      </div>

      <div class="rail-spacer"></div>

      <div class="rail-section" data-section="profile">
        <button class="rail-row" id="rail-profile-btn" type="button" title="Your profile">
          <span class="rail-icon-btn rail-avatar-btn"><img id="rail-avatar" src="favicon-32.png" alt=""/></span>
          <span class="rail-label" id="rail-profile-name">Profile</span>
        </button>
        <div class="rail-flyout" id="profile-flyout">
          <div class="profile-menu-avatar-row">
            <div class="profile-avatar-edit-wrap">
              <img id="profile-menu-avatar-preview" src="apple-touch-icon.png" alt=""/>
              <button class="avatar-edit-overlay" id="profile-menu-avatar-btn" title="Change photo" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
              </button>
            </div>
            <input type="file" id="profile-menu-avatar-upload" accept="image/*" style="display:none"/>
          </div>
          <input class="profile-menu-name-input" id="profile-menu-name-input" type="text" placeholder="Display name" maxlength="20" autocomplete="off" spellcheck="false"/>
          <div class="profile-code-row">
            <input class="profile-code-input" id="profile-code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000"/>
            <button class="profile-code-save-btn" id="profile-code-save-btn" type="button" title="Save code">✓</button>
          </div>
          <div class="profile-menu-error" id="profile-menu-error"></div>
          <button class="profile-menu-save-btn" id="profile-menu-save-btn" type="button">Save changes</button>
          <div class="theme-mini-grid" id="theme-grid-profile"></div>
          <div class="profile-menu-footer-row">
            <button class="signout-btn" id="signout-btn" type="button">Sign Out</button>
            <button class="delete-account-btn" id="delete-account-btn" type="button">Delete Account</button>
          </div>
        </div>
      </div>
    </nav>

    <div class="glass chat-card">
    <div id="chat-view">
    <header class="chat-header">
      <div class="header-left">
        <button class="icon-btn rail-toggle-btn" id="rail-toggle-btn" title="Menu" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
      </div>
      <div class="current-room-label" id="current-room-label">
        <span class="current-room-icon" id="current-room-icon">💬</span>
        <span class="current-room-name" id="current-room-name">General</span>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="search-btn" title="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="icon-btn" id="sound-btn" title="Toggle sound">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        </button>
        <button class="icon-btn" id="notif-btn" title="Toggle notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <div class="more-wrap">
          <button class="icon-btn" id="more-btn" title="More">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
          <div class="more-menu" id="more-menu">
            <button id="select-mode-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              Select Messages
            </button>
            <button id="recently-deleted-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              Recently Deleted
            </button>
          </div>
        </div>
        <div class="online-badge">
          <span class="pulse-dot"></span>
          <span class="online-txt" id="online-count">0 online</span>
        </div>
      </div>
    </header>

    <div class="select-bar" id="select-bar">
      <span id="select-count">0 selected</span>
      <div class="select-bar-btns">
        <button id="select-delete-btn" class="select-action-btn select-action-delete">Delete</button>
        <button id="select-cancel-btn" class="select-action-btn select-action-cancel">Cancel</button>
      </div>
    </div>

    <div class="search-bar" id="search-bar">
      <input type="text" id="search-input" placeholder="Search messages..." autocomplete="off"/>
    </div>

    <div class="messages" id="messages"></div>

    <button class="scroll-bottom-btn" id="scroll-bottom-btn" title="Jump to latest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>

    <div class="reply-bar" id="reply-bar">
      <span class="reply-bar-text" id="reply-bar-text"></span>
      <button class="reply-bar-close" id="reply-bar-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="edit-bar" id="edit-bar">
      <span class="edit-bar-text">Editing message</span>
      <button class="reply-bar-close" id="edit-bar-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="img-preview-bar" id="img-preview-bar"></div>

    <footer class="input-area">
      <input type="file" id="img-upload" accept="image/*" style="display:none"/>
      <button class="attach-btn" id="attach-btn" title="Attach image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea class="msg-input" id="msg-input" rows="1" placeholder="Message..." autocomplete="off" spellcheck="false"></textarea>
      <button class="send-btn" id="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </footer>
    </div>

    <div id="games-view" class="hidden">
      <header class="chat-header">
        <div class="header-left">
          <button class="icon-btn rail-toggle-btn" id="games-rail-toggle-btn" title="Menu" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </button>
          <span class="header-title">Glass Games</span>
        </div>
        <div class="header-right"></div>
      </header>
      <div class="games-body" id="games-body">
        <input type="text" id="games-search" class="games-search-input" placeholder="Search games..." autocomplete="off"/>
        <div id="games-results"></div>
      </div>
    </div>
    </div>
  </div>
</div>

<div id="recently-deleted-screen" class="screen hidden">
  <div class="glass chat-card rd-card">
    <header class="chat-header">
      <div class="header-left">
        <button class="icon-btn" id="rd-back-btn" title="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="header-title">Recently Deleted</span>
      </div>
    </header>
    <div class="rd-list" id="recently-deleted-list"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.fog.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="themes-data.js"></script>
<script src="sidebar.js"></script>
<script src="app.js"></script>
<script src="games.js"></script>

</body>
</html>
